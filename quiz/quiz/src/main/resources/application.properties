spring.application.name=QUIZ-SERVICE
server.port=8081

# MongoDB Connection (Container Name: mongodb)
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=QuizDB
spring.data.mongodb.uri=mongodb://mongo:27017/QuizDB
#spring.data.mongodb.uri=mongodb://mongo.default.svc.cluster.local:27017/QuizDB
# Eureka Client
eureka.client.service-url.defaultZone=http://serviceregistry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

