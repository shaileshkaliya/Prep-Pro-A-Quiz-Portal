spring.application.name=QUESTION-SERVICE
server.port=8082

# MongoDB Connection (Container Name: mongodb)
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=QuestionDB
spring.data.mongodb.uri=mongodb://mongo:27017/QuestionDB

# Eureka Client
eureka.client.service-url.defaultZone=http://serviceregistry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

